<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173d35">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>FeedTrack Reptile Edition</title>
  <script>
    document.write(`<link rel="stylesheet" href="style.css?v=${Date.now()}">`);
  </script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">REPTILE EDITION</p>
        <h1>🐢 FeedTrack</h1>
      </div>
      <button class="reset-button" id="resetToday" type="button">今日をリセット</button>
    </header>

    <section class="summary" aria-labelledby="feeding-title">
      <p class="date-label">きょうの日にち</p>
      <p class="date" id="today"></p>
      <h2 id="feeding-title">今日の給餌</h2>
      <p class="count"><span id="fedCount">0</span><span class="count-total"> / 9 完了</span></p>
      <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
      <p class="summary-message" id="summaryMessage">まだごはんをあげていません</p>
    </section>

    <section class="pets" aria-labelledby="pets-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">TODAY'S PETS</p>
          <h2 id="pets-title">9ひきの仲間</h2>
        </div>
        <span class="hint">← よこにスライド →</span>
      </div>
      <div class="pet-list" id="petList"></div>
    </section>
  </main>
  <script type="module">
    import(`./app.js?v=${Date.now()}`);
  </script>
</body>
</html>
